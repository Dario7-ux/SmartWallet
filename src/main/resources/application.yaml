spring:
  application:
    name: SmartWallet

  profiles:
    active:
    - postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

smartwallet:
  notificaciones:
    destinatario: ${NOTIFICACIONES_EMAIL:alertas@smartwallet.com}
  tipo-cambio:
    api-url: ${TIPO_CAMBIO_API_URL:https://open.er-api.com/v6/latest}
  security:
    default-admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
      role: ADMIN
